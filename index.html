<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영애 플래너</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- 구글 파이어베이스 실시간 DB 라이브러리 -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #F9F7F2;
      --card-bg: #FFFFFF;
      --border: #E8E2D8;
      --text-main: #342E2B;
      --text-muted: #877E77;
      --accent: #9C7A5B;
      --accent-light: #F4ECE1;
      --accent-dark: #7D5E42;
      --warning: #D97706;
      --warning-light: #FEF3C7;
      --important-color: #E65100;
      --important-bg: #FFF8E7;
      --header-img: url('https://images.unsplash.com/photo-1507842229451-7f01be8f5043?auto=format&fit=crop&w=1600&q=80');
      --shadow: 0 4px 18px rgba(135, 126, 119, 0.09);
      --radius: 16px;
      --sun-color: #E63946;
      --holiday-bg: #FFF5F5;
      --sat-color: #2A6F97;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    /* 콤팩트 상단 헤더 배너 */
    .header-banner {
      height: 85px;
      background-image: var(--header-img);
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .header-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%);
      display: flex; align-items: center; padding: 0 20px;
    }
    .header-container {
      max-width: 1180px; width: 100%; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; color: white;
    }
    .header-title h1 { 
      font-size: 21px; 
      font-weight: 800; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }
    .editable-title {
      outline: none;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: text;
      transition: background 0.2s;
    }
    .editable-title:hover { background: rgba(255,255,255,0.25); }
    .editable-title:focus { background: #FFFFFF; color: #111; }

    .sync-status-indicator {
      display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #10B981; margin-right: 6px;
    }

    .main-wrap { max-width: 1180px; margin: 12px auto 0; padding: 0 16px; position: relative; z-index: 2; }
    
    .mindful-bar {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 16px; box-shadow: var(--shadow); margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }

    .view-tabs {
      display: flex; background: var(--card-bg); padding: 5px; border-radius: 30px;
      box-shadow: var(--shadow); margin-bottom: 16px; border: 1px solid var(--border);
    }
    .view-tab {
      flex: 1; text-align: center; padding: 9px 0; border-radius: 24px;
      font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer;
      border: none; background: transparent; transition: all 0.2s;
    }
    .view-tab.active { background: var(--accent); color: white; }

    .card {
      background: var(--card-bg); border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 18px;
    }
    
    /* 2단 레이아웃 (목록 우선) */
    .split-layout { display: grid; grid-template-columns: 1fr 1.25fr; gap: 18px; }
    @media (max-width: 920px) { .split-layout { grid-template-columns: 1fr; } }

    /* 달력 그리드 */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .cal-header-cell { text-align: center; font-size: 12px; font-weight: 700; padding: 5px 0; color: var(--text-muted); }
    .cal-header-cell.sun { color: var(--sun-color); }
    .cal-header-cell.sat { color: var(--sat-color); }

    .cal-day-cell {
      min-height: 66px; background: var(--bg); border-radius: 10px; padding: 6px;
      cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
      border: 1px solid transparent; transition: all 0.15s;
      position: relative;
    }
    .cal-day-cell:hover { border-color: var(--accent); transform: translateY(-1px); }
    .cal-day-cell.selected { background: var(--accent-light); border: 2px solid var(--accent); }
    .cal-day-cell.is-custom-holiday { background: var(--holiday-bg); border-color: #FFCDD2; }
    .cal-day-cell.has-important { border-color: #FBBF24; }
    
    .cal-day-cell.today .day-num {
      background: var(--accent); color: white; border-radius: 50%;
      width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
    }
    .day-num { font-size: 13px; font-weight: 700; }
    .day-num.sun, .day-num.holiday { color: var(--sun-color); }
    .day-num.sat { color: var(--sat-color); }

    .todo-dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; align-items: center; }
    .todo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .todo-dot.done { background: #A0AAB2; }
    .todo-dot.important { background: #F59E0B; width: 7px; height: 7px; box-shadow: 0 0 4px rgba(245, 158, 11, 0.7); }

    /* 입력 영역 & 버튼들 */
    .input-row { display: flex; gap: 6px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
    .input-row input {
      flex: 1; min-width: 140px; padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; outline: none; background: var(--bg);
    }
    .btn-action {
      border: 1px solid #E5E7EB; background: #FFF; padding: 8px 10px;
      border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; color: #666;
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-action.active-star {
      border-color: #F59E0B; background: #FFFBEB; color: #B45309;
    }
    .btn-action.active-holiday {
      border-color: #EF4444; background: #FEF2F2; color: #DC2626;
    }
    .btn-add { background: var(--accent); color: white; border: none; padding: 0 16px; height: 38px; border-radius: 8px; font-weight: 700; cursor: pointer; white-space: nowrap; }

    /* 누적 목록 */
    .todo-scroll-list { max-height: 440px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
    .todo-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-radius: 8px; background: var(--bg);
      border: 1px solid transparent; transition: all 0.15s;
    }
    .todo-item:hover { border-color: var(--border); }
    .todo-item.is-important {
      background: var(--important-bg);
      border: 1px solid #FFD180;
    }
    .todo-left { display: flex; align-items: center; gap: 8px; flex: 1; }
    
    .todo-date-tag {
      font-size: 11.5px; font-weight: 800; background: var(--card-bg);
      border: 1px solid var(--border); padding: 2px 7px; border-radius: 6px; color: var(--accent);
      white-space: nowrap;
    }
    .todo-date-tag.sun, .todo-date-tag.holiday { color: var(--sun-color); border-color: #FFCDD2; background: #FFEBEE; }
    .todo-date-tag.sat { color: var(--sat-color); border-color: #BBDEFB; background: #E3F2FD; }

    .star-btn {
      border: none; background: none; font-size: 16px; cursor: pointer;
      color: #D1D5DB; padding: 0 2px; transition: color 0.15s;
    }
    .star-btn.active { color: #F59E0B; }

    .todo-item.done span.todo-text { text-decoration: line-through; color: var(--text-muted); }
    .btn-del { border: none; background: transparent; color: #CCC; cursor: pointer; font-size: 18px; padding: 0 4px; }
    .btn-del:hover { color: #E63946; }

    /* 주간 구분선 */
    .week-divider {
      display: flex; align-items: center; gap: 8px; margin: 8px 0 4px;
      color: #B0A69D; font-size: 11px; font-weight: 700;
    }
    .week-divider::before, .week-divider::after {
      content: ''; flex: 1; height: 1px; border-bottom: 1px dashed #DDD5CC;
    }

    .quarter-card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
    .quarter-card.current-quarter { border: 2px solid var(--accent); }
    .mini-3cal-wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .mini-cal-box { background: var(--bg); border-radius: 10px; padding: 10px; border: 1px solid var(--border); }
    .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
    .mini-day { font-size: 11px; padding: 3px 0; border-radius: 4px; cursor: pointer; position: relative; }
    .mini-day.holiday { color: var(--sun-color); font-weight: 700; }
    .mini-day.has-todo::after {
      content: ''; position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
    }
    .mini-day.has-important::after {
      background: #F59E0B; width: 5px; height: 5px;
    }
    .year-12grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    @media (max-width: 880px) { .year-12grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 550px) { .year-12grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="header-banner">
    <div class="header-overlay">
      <div class="header-container">
        <div class="header-title">
          <h1>
            ✨ <span class="editable-title" id="mainHeaderTitle" contenteditable="true" onblur="saveMainTitle(this.innerText)">2026년 다이어리</span>
            <span style="font-size: 14px; opacity: 0.85; cursor: pointer;" title="클릭하여 제목 수정">✏️</span>
          </h1>
        </div>
        <p style="font-size: 13px;">
          <span class="sync-status-indicator" id="syncDot"></span><span id="syncText">🧐 관찰자 시점으로 🌱</span>
        </p>
      </div>
    </div>
  </header>

  <main class="main-wrap">
    <div class="mindful-bar">
      <div style="font-weight:700; font-size:13.5px; color:var(--text-main);">
        ✨ 한걸음 한걸음 발걸음을 앞으로 내밀 때, 나의 아침은 여전히 눈부시고 나의 저녁은 여전히 눈물겹도록 아름답지 않은가! 🌿
      </div>
    </div>

    <nav class="view-tabs">
      <button class="view-tab active" onclick="switchView('monthly')">📅 월별 달력 ❤️ 아자아자</button>
      <button class="view-tab" onclick="switchView('quarterly')">📊 분기별 달력 🎯</button>
      <button class="view-tab" onclick="switchView('yearly')">🗺️ 1년 전체 달력 🌈</button>
    </nav>

    <!-- 1. 월별 화면: 누적 목록이 먼저 배치됨 -->
    <section id="view-monthly">
      <div class="split-layout">
        
        <!-- [1] 좌측/상단: 이번 달 전체 누적 목록 (먼저 나오게 배치) -->
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <h3 style="font-size:16px; font-weight:800;" id="monthlyAccumTitle">🗓️ 11월 전체 누적 일정</h3>
            <span id="monthlyAccumBadge" style="font-size:12px; background:var(--accent-light); color:var(--accent); padding:3px 9px; border-radius:12px; font-weight:800;">0/0</span>
          </div>
          <div class="todo-scroll-list" id="monthlyAccumList"></div>
        </div>

        <!-- [2] 우측/하단: 월 달력 및 당일 할 일 입력 -->
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <button onclick="changeMonth(-1)" style="padding:4px 10px; cursor:pointer; border-radius:6px; border:1px solid var(--border); background:white;">◀</button>
            <h2 id="calendarTitle" style="font-size:18px; font-weight:800;"></h2>
            <button onclick="changeMonth(1)" style="padding:4px 10px; cursor:pointer; border-radius:6px; border:1px solid var(--border); background:white;">▶</button>
          </div>
          <div class="cal-grid" id="mainCalendarGrid"></div>

          <hr style="border:0; border-top:1px solid var(--border); margin:18px 0;">

          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <div style="font-size:14px; font-weight:800;" id="selectedDateLabel">
              📌 선택한 날짜에 할 일 등록
            </div>
            <!-- 선택된 날짜 휴일 토글 버튼 -->
            <button type="button" id="holidayToggleBtn" class="btn-action" onclick="toggleDateHoliday()">🏖️ 휴일 지정</button>
          </div>
          
          <div class="input-row">
            <input type="text" id="dayTodoInput" placeholder="할 일 입력 후 Enter..." onkeypress="handleDayEnter(event)">
            <button type="button" id="importantToggleBtn" class="btn-action" onclick="toggleInputImportance()">⭐ 중요</button>
            <button class="btn-add" onclick="addDayTodo()">➕ 등록</button>
          </div>
        </div>

      </div>
    </section>

    <!-- 2. 분기별 화면 -->
    <section id="view-quarterly" style="display: none;">
      <div id="quarterlyContainer"></div>
    </section>

    <!-- 3. 1년 화면 -->
    <section id="view-yearly" style="display: none;">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <div>
            <h3 style="font-size:17px; font-weight:800;" id="rollingYearAccumTitle">📋 앞으로 1년간의 누적 일정 🚀</h3>
          </div>
          <span id="yearlyAccumBadge" style="font-size:12px; background:var(--accent-light); color:var(--accent); padding:3px 9px; border-radius:12px; font-weight:800;">0/0</span>
        </div>
        <div class="todo-scroll-list" id="yearlyAccumList" style="max-height:360px;"></div>
      </div>
      <div class="year-12grid" id="year12Grid"></div>
    </section>
  </main>

  <script>
    const firebaseConfig = { 
      apiKey: "AIzaSyCnRI1qFnvKIgFQ0PJQ_Jj85pOPK7UdlNQ",
      databaseURL: "https://y-planner-67ba4-default-rtdb.firebaseio.com",
      projectId: "y-planner-67ba4"
    };

    let db = null;
    let isInputImportant = false;
    let store = { 
      todos: {},
      holidays: {},
      title: "2026년 다이어리"
    };

    const dayKoreanNames = ['일', '월', '화', '수', '목', '금', '토'];

    try {
      if (firebaseConfig.apiKey !== "본인의_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        
        db.ref('planner_data').on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) {
            store.todos = val.todos || {};
            store.holidays = val.holidays || {};
            if (val.title) {
              store.title = val.title;
              document.getElementById('mainHeaderTitle').innerText = val.title;
            }
          }
          renderAllViews();
        });
      } else {
        document.getElementById('syncDot').style.background = '#F59E0B';
        document.getElementById('syncText').innerText = '로컬 모드';
        const saved = localStorage.getItem('planner_todos_local');
        if (saved) store = JSON.parse(saved);
        if (!store.holidays) store.holidays = {};
      }
    } catch(e) {
      console.error(e);
    }

    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth() + 1;
    let selectedDateStr = formatDateKey(today.getFullYear(), today.getMonth() + 1, today.getDate());

    function saveMainTitle(text) {
      store.title = text.trim();
      syncSave();
    }

    function formatDateKey(y, m, d) {
      return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function getDayOfWeek(dStr) {
      const [y, m, d] = dStr.split('-').map(Number);
      return new Date(y, m - 1, d).getDay();
    }

    function isHoliday(dStr) {
      const dayIdx = getDayOfWeek(dStr);
      if (dayIdx === 0) return true;
      return !!(store.holidays && store.holidays[dStr]);
    }

    function formatShortDateWithDay(dStr) {
      const p = dStr.split('-');
      const dayIdx = getDayOfWeek(dStr);
      return {
        text: `${parseInt(p[1])}/${parseInt(p[2])}(${dayKoreanNames[dayIdx]})`,
        dayIdx: dayIdx,
        isCustomHoliday: !!(store.holidays && store.holidays[dStr])
      };
    }

    function syncSave() {
      if (db) {
        db.ref('planner_data').set({ 
          todos: store.todos,
          holidays: store.holidays || {},
          title: store.title || "2026년 다이어리"
        });
      } else {
        localStorage.setItem('planner_todos_local', JSON.stringify(store));
      }
    }

    function toggleDateHoliday() {
      if (!store.holidays) store.holidays = {};
      if (store.holidays[selectedDateStr]) {
        delete store.holidays[selectedDateStr];
      } else {
        store.holidays[selectedDateStr] = true;
      }
      syncSave();
      renderAllViews();
    }

    function toggleInputImportance() {
      isInputImportant = !isInputImportant;
      const btn = document.getElementById('importantToggleBtn');
      if (isInputImportant) {
        btn.classList.add('active-star');
      } else {
        btn.classList.remove('active-star');
      }
    }

    function changeMonth(offset) {
      currentMonth += offset;
      if (currentMonth > 12) { currentMonth = 1; currentYear++; }
      if (currentMonth < 1) { currentMonth = 12; currentYear--; }
      renderAllViews();
    }

    function switchView(view) {
      document.querySelectorAll('.view-tab').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('view-monthly').style.display = view === 'monthly' ? 'block' : 'none';
      document.getElementById('view-quarterly').style.display = view === 'quarterly' ? 'block' : 'none';
      document.getElementById('view-yearly').style.display = view === 'yearly' ? 'block' : 'none';
      renderAllViews();
    }

    function renderAllViews() {
      renderMainCalendar();
      renderMonthlyAccum();
      renderQuarterly();
      renderYearly();
      updateHolidayButtonUI();
    }

    function updateHolidayButtonUI() {
      const btn = document.getElementById('holidayToggleBtn');
      if (!btn) return;
      const isCustom = !!(store.holidays && store.holidays[selectedDateStr]);
      if (isCustom) {
        btn.classList.add('active-holiday');
        btn.innerText = '🏖️ 휴일 해제';
      } else {
        btn.classList.remove('active-holiday');
        btn.innerText = '🏖️ 휴일 지정';
      }
    }

    function renderMainCalendar() {
      document.getElementById('calendarTitle').innerText = `🗓️ ${currentYear}년 ${currentMonth}월`;
      const grid = document.getElementById('mainCalendarGrid');
      grid.innerHTML = '';

      dayKoreanNames.forEach((d, idx) => {
        const h = document.createElement('div');
        h.className = 'cal-header-cell' + (idx === 0 ? ' sun' : idx === 6 ? ' sat' : '');
        h.innerText = d;
        grid.appendChild(h);
      });

      const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
      const totalDays = new Date(currentYear, currentMonth, 0).getDate();
      for (let i = 0; i < firstDay; i++) {
        const c = document.createElement('div');
        c.className = 'cal-day-cell'; c.style.opacity = '0.2';
        grid.appendChild(c);
      }

      for (let day = 1; day <= totalDays; day++) {
        const dKey = formatDateKey(currentYear, currentMonth, day);
        const dayOfWeek = new Date(currentYear, currentMonth - 1, day).getDay();
        const isToday = (currentYear === today.getFullYear() && currentMonth === (today.getMonth()+1) && day === today.getDate());
        const isSelected = (dKey === selectedDateStr);
        const isHolidayDate = isHoliday(dKey);
        const isCustomHoliday = !!(store.holidays && store.holidays[dKey]);

        const list = store.todos[dKey] || [];
        const hasImportant = list.some(x => x.important && !x.done);

        const cell = document.createElement('div');
        cell.className = 'cal-day-cell' + 
          (isToday ? ' today' : '') + 
          (isSelected ? ' selected' : '') + 
          (isCustomHoliday ? ' is-custom-holiday' : '') + 
          (hasImportant ? ' has-important' : '');

        let numClass = 'day-num';
        if (isHolidayDate) numClass += ' holiday';
        else if (dayOfWeek === 6) numClass += ' sat';

        let numSpan = `<span class="${numClass}">${day}</span>`;
        if (hasImportant) {
          numSpan += `<span style="font-size:10px; color:#F59E0B; margin-left:2px;">⭐</span>`;
        }

        let dots = '<div class="todo-dots">';
        list.slice(0, 4).forEach(it => {
          let dotClass = 'todo-dot';
          if (it.done) dotClass += ' done';
          else if (it.important) dotClass += ' important';
          dots += `<div class="${dotClass}"></div>`;
        });
        dots += '</div>';

        cell.innerHTML = `<div>${numSpan}</div>${dots}`;
        cell.onclick = () => {
          selectedDateStr = dKey;
          renderMainCalendar();
          updateSelectedLabel();
          updateHolidayButtonUI();
        };
        grid.appendChild(cell);
      }
      updateSelectedLabel();
    }

    function updateSelectedLabel() {
      const p = selectedDateStr.split('-');
      const dIdx = getDayOfWeek(selectedDateStr);
      const isCustom = !!(store.holidays && store.holidays[selectedDateStr]);
      document.getElementById('selectedDateLabel').innerText = 
        `📌 ${parseInt(p[1])}월 ${parseInt(p[2])}일(${dayKoreanNames[dIdx]})${isCustom ? ' 🏖️[휴일]' : ''} 할 일 등록`;
    }

    function handleDayEnter(e) {
      if (e.key === 'Enter') addDayTodo();
    }

    function addDayTodo() {
      const input = document.getElementById('dayTodoInput');
      const text = input.value.trim();
      if (!text) return;
      if (!store.todos[selectedDateStr]) store.todos[selectedDateStr] = [];
      
      store.todos[selectedDateStr].push({ 
        id: Date.now().toString(), 
        text, 
        done: false,
        important: isInputImportant 
      });

      input.value = '';
      if (isInputImportant) toggleInputImportance();
      syncSave();
      renderAllViews();
    }

    function toggleTodoItem(dKey, id) {
      const it = (store.todos[dKey] || []).find(x => x.id === id);
      if (it) it.done = !it.done;
      syncSave();
      renderAllViews();
    }

    function toggleTodoImportance(dKey, id) {
      const it = (store.todos[dKey] || []).find(x => x.id === id);
      if (it) it.important = !it.important;
      syncSave();
      renderAllViews();
    }

    function deleteTodoItem(dKey, id) {
      store.todos[dKey] = (store.todos[dKey] || []).filter(x => x.id !== id);
      if (store.todos[dKey].length === 0) delete store.todos[dKey];
      syncSave();
      renderAllViews();
    }

    /* 누적 목록 생성 함수 */
    function buildAccumulatedListUI(container, dKeys) {
      container.innerHTML = '';
      let total = 0, done = 0;

      if (dKeys.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:34px 10px;">🌱 등록된 일정이 아직 없어요!<br>달력에서 날짜를 콕 찍고 새로운 일정을 시작해 보세요 ✨</div>';
        return { total: 0, done: 0 };
      }

      for (let i = 0; i < dKeys.length; i++) {
        const dKey = dKeys[i];
        const dayIdx = getDayOfWeek(dKey);
        const dateInfo = formatShortDateWithDay(dKey);
        const isHolidayDate = isHoliday(dKey);

        let tagClass = 'todo-date-tag';
        if (isHolidayDate) tagClass += ' holiday';
        else if (dayIdx === 6) tagClass += ' sat';

        store.todos[dKey].forEach(it => {
          total++; if (it.done) done++;
          
          const div = document.createElement('div');
          div.className = 'todo-item' + (it.done ? ' done' : '') + (it.important && !it.done ? ' is-important' : '');
          div.innerHTML = `
            <div class="todo-left">
              <input type="checkbox" ${it.done ? 'checked' : ''} onchange="toggleTodoItem('${dKey}', '${it.id}')">
              <button class="star-btn ${it.important ? 'active' : ''}" onclick="toggleTodoImportance('${dKey}', '${it.id}')" title="중요 일정 변경">★</button>
              <span class="${tagClass}">${dateInfo.text}</span>
              <span class="todo-text">${it.text}</span>
            </div>
            <button class="btn-del" onclick="deleteTodoItem('${dKey}', '${it.id}')">×</button>
          `;
          container.appendChild(div);
        });

        // 주간 구분선
        if (i < dKeys.length - 1) {
          const nextKey = dKeys[i + 1];
          const nextDayIdx = getDayOfWeek(nextKey);
          if (dayIdx === 0 || nextDayIdx < dayIdx || (nextDayIdx === 1 && dayIdx !== 1)) {
            const divider = document.createElement('div');
            divider.className = 'week-divider';
            divider.innerText = '✨ ── 🌷 다음 주 ── ✨';
            container.appendChild(divider);
          }
        }
      }

      return { total, done };
    }

    function renderMonthlyAccum() {
      document.getElementById('monthlyAccumTitle').innerText = `🗓️ ${currentMonth}월 전체 누적 일정`;
      const wrap = document.getElementById('monthlyAccumList');
      const prefix = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
      const dKeys = Object.keys(store.todos).filter(k => k.startsWith(prefix)).sort();
      
      const stats = buildAccumulatedListUI(wrap, dKeys);
      document.getElementById('monthlyAccumBadge').innerText = `${stats.done}/${stats.total}`;
    }

    function renderQuarterly() {
      const container = document.getElementById('quarterlyContainer');
      container.innerHTML = '';
      
      const realThisMonth = today.getMonth() + 1;
      const currentQuarterIdx = Math.floor((realThisMonth - 1) / 3);

      const baseQuarters = [
        { qNum: 1, name: '1분기', m: [1,2,3], icon: '🌱' },
        { qNum: 2, name: '2분기', m: [4,5,6], icon: '☀️' },
        { qNum: 3, name: '3분기', m: [7,8,9], icon: '🍁' },
        { qNum: 4, name: '4분기', m: [10,11,12], icon: '❄️' }
      ];

      const rotatedQuarters = [];
      for (let i = 0; i < 4; i++) {
        rotatedQuarters.push(baseQuarters[(currentQuarterIdx + i) % 4]);
      }

      rotatedQuarters.forEach((q, idx) => {
        const isCurrentQ = (idx === 0);
        const card = document.createElement('div');
        card.className = 'quarter-card' + (isCurrentQ ? ' current-quarter' : '');
        card.innerHTML = `
          <div style="font-size:17px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">
            <div>${q.icon} ${currentYear}년 ${q.name} (${q.m[0]}월 ~ ${q.m[2]}월)</div>
            ${isCurrentQ ? '<span style="font-size:12px;background:var(--accent);color:white;padding:3px 10px;border-radius:12px;font-weight:700;">📍 현재 분기</span>' : ''}
          </div>
          <div class="mini-3cal-wrap">
            ${buildMini(currentYear, q.m[0])}
            ${buildMini(currentYear, q.m[1])}
            ${buildMini(currentYear, q.m[2])}
          </div>
          <div class="todo-scroll-list" id="q_list_${q.qNum}" style="max-height:180px;"></div>
        `;
        container.appendChild(card);
        
        const listWrap = card.querySelector(`#q_list_${q.qNum}`);
        const qKeys = Object.keys(store.todos).filter(k => {
          if (!k.startsWith(currentYear.toString())) return false;
          const mm = parseInt(k.split('-')[1]);
          return q.m.includes(mm);
        }).sort();

        buildAccumulatedListUI(listWrap, qKeys);
      });
    }

    function renderYearly() {
      const startYear = today.getFullYear();
      const startMonth = today.getMonth() + 1;

      const rollingMonths = [];
      for (let i = 0; i < 12; i++) {
        let m = startMonth + i;
        let y = startYear;
        if (m > 12) {
          y += Math.floor((m - 1) / 12);
          m = ((m - 1) % 12) + 1;
        }
        rollingMonths.push({ year: y, month: m });
      }

      // 상단: 12개월 누적 일정 목록
      const yWrap = document.getElementById('yearlyAccumList');
      const allRollingKeys = Object.keys(store.todos).filter(k => {
        const [y, m] = k.split('-').map(Number);
        return rollingMonths.some(rm => rm.year === y && rm.month === m);
      }).sort();

      const stats = buildAccumulatedListUI(yWrap, allRollingKeys);
      document.getElementById('yearlyAccumBadge').innerText = `${stats.done}/${stats.total}`;

      // 하단: 12개월 롤링 달력
      const grid = document.getElementById('year12Grid');
      grid.innerHTML = '';
      rollingMonths.forEach(item => {
        grid.innerHTML += buildMini(item.year, item.month);
      });
    }

    function buildMini(y, m) {
      const fDay = new Date(y, m - 1, 1).getDay();
      const tDays = new Date(y, m, 0).getDate();
      let h = `
        <div class="mini-cal-box">
          <div style="font-size:12.5px;font-weight:800;margin-bottom:5px;display:flex;justify-content:space-between;">
            <span>🗓️ ${y}년 ${m}월</span>
            <button onclick="goToSpecificMonth(${y}, ${m})" style="border:none;background:none;color:var(--accent);font-size:11px;font-weight:700;cursor:pointer;">이동 ›</button>
          </div>
          <div class="mini-grid">
      `;
      for (let i = 0; i < fDay; i++) h += `<div></div>`;
      for (let d = 1; d <= tDays; d++) {
        const k = formatDateKey(y, m, d);
        const list = store.todos[k] || [];
        const hasTodo = list.length > 0;
        const hasImportant = list.some(x => x.important && !x.done);
        const isHolidayDate = isHoliday(k);
        
        let miniClass = 'mini-day';
        if (isHolidayDate) miniClass += ' holiday';
        if (hasImportant) miniClass += ' has-important';
        else if (hasTodo) miniClass += ' has-todo';

        h += `<div class="${miniClass}" onclick="goToSpecificDay('${k}')">${d}</div>`;
      }
      h += `</div></div>`;
      return h;
    }

    function goToSpecificMonth(y, m) {
      currentYear = y;
      currentMonth = m;
      switchViewDirect('monthly');
      renderAllViews();
    }

    function goToSpecificDay(dateKey) {
      selectedDateStr = dateKey;
      const p = dateKey.split('-');
      currentYear = parseInt(p[0]);
      currentMonth = parseInt(p[1]);
      switchViewDirect('monthly');
      renderAllViews();
    }

    function switchViewDirect(view) {
      document.querySelectorAll('.view-tab').forEach(b => {
        if (b.innerText.includes('월별') && view === 'monthly') b.classList.add('active');
        else b.classList.remove('active');
      });
      document.getElementById('view-monthly').style.display = 'block';
      document.getElementById('view-quarterly').style.display = 'none';
      document.getElementById('view-yearly').style.display = 'none';
    }

    renderAllViews();
  </script>
</body>
</html>
